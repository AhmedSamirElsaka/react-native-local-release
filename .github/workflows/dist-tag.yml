# One-off / maintainer helper: move an npm dist-tag without republishing.
name: npm dist-tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version that already exists on npm
        required: true
        type: string
      tag:
        description: Dist-tag to point at that version
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Move dist-tag
        run: |
          PKG=@ahmedsamirelsaka/react-native-local-release
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          npm view "$PKG@$VERSION" version
          npm dist-tag add "$PKG@$VERSION" "$TAG"
          npm dist-tag ls "$PKG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
