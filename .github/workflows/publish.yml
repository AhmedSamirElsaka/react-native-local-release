name: Publish npm + GitHub Release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional protected environment for npm Trusted Publishing.
    # Create it under Settings → Environments → npm-publish, or remove this line.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version $PKG_VERSION does not match tag $TAG"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build canonical tarball
        run: |
          npm pack
          TARBALL=$(ls ahmedsamirelsaka-react-native-local-release-*.tgz | head -1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          shasum -a 256 "$TARBALL" | tee checksums.sha256
          npx --yes @cyclonedx/cyclonedx-npm@3.0.0 --output-file sbom.cdx.json || true

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.TARBALL }}
            checksums.sha256
            sbom.cdx.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npmjs with provenance
        id: npm_publish
        continue-on-error: true
        run: |
          set +e
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN…"
            out=$(npm publish --provenance --access public --tag next 2>&1)
            status=$?
          else
            echo "No NPM_TOKEN secret. Trying Trusted Publishing (OIDC)…"
            out=$(npm publish --provenance --access public --tag next 2>&1)
            status=$?
          fi
          printf '%s\n' "$out"

          if [ $status -eq 0 ]; then
            echo "Published $PKG_NAME@$PKG_VERSION"
            exit 0
          fi

          # Idempotent: version already on the registry is success for this tag.
          if printf '%s' "$out" | grep -qiE 'cannot publish over the previously published versions|previously published versions'; then
            echo "::notice::$PKG_NAME@$PKG_VERSION is already on npm — treating as success."
            npm view "$PKG_NAME@$PKG_VERSION" version
            exit 0
          fi

          echo "::warning::npm publish failed."
          echo "Configure NPM_TOKEN or Trusted Publishing if this was an auth error."
          echo "GitHub Release assets were still attached."
          exit $status
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify package is on npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Registry can lag a few seconds after a successful publish.
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm view "$PKG_NAME@$PKG_VERSION" version; then
              echo "OK: $PKG_NAME@$PKG_VERSION is available on npmjs"
              exit 0
            fi
            echo "Attempt $attempt: not visible yet, waiting…"
            sleep 5
          done
          echo "Package not visible on npm after retries"
          exit 1

      - name: Fail if npm did not publish
        if: steps.npm_publish.outcome != 'success'
        run: |
          echo "CI tests and GitHub Release succeeded, but npm publish did not."
          echo "Add NPM_TOKEN or Trusted Publishing, then re-run this workflow / re-push the tag."
          exit 1
