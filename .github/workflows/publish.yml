name: Publish npm + GitHub Release assets

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version $PKG_VERSION does not match tag $TAG"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build canonical tarball
        run: |
          npm pack
          TARBALL=$(ls ahmedsamirelsaka-react-native-local-release-*.tgz | head -1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          shasum -a 256 "$TARBALL" | tee checksums.sha256
          npx --yes @cyclonedx/cyclonedx-npm@3.0.0 --output-file sbom.cdx.json || true

      - name: Publish to npmjs with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef650f79 # v2.2.1
        with:
          files: |
            ${{ env.TARBALL }}
            checksums.sha256
            sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
